<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>법인등기 예상 견적서 | 등기로</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
:root{--s:#35a9e1;--sd:#168dca;--n:#172840;--l:#d9e5ee;--bg:#f5f8fb}
body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#202936}
.sheet{width:min(820px,calc(100% - 24px));margin:20px auto;background:#fff;border:1px solid var(--l);border-radius:18px;padding:28px;box-shadow:0 12px 36px rgba(23,40,64,.08)}
.head{display:flex;align-items:end;justify-content:space-between;gap:18px;padding-bottom:15px;margin-bottom:16px;border-bottom:3px solid var(--s)}
.brand{font-size:29px;font-weight:900;color:var(--s)}
.title{font-size:20px;font-weight:900;color:var(--n);text-align:center;flex:1}
.date{font-size:11px;color:#667789;white-space:nowrap}
.selected{font-size:13px;color:#526171;margin:4px 0 18px}
.columns{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start}
h3{font-size:16px;margin:6px 0 9px;color:var(--n)}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #91adbf;font-size:13px}
.row span{color:#263e53;font-weight:700}
.row b{color:#0b2137;font-weight:850;text-align:right}
.total{margin-top:14px;padding:14px;border-radius:12px;background:#f0f9fd}
.total span{font-size:13px;color:#263e53;font-weight:800}
.total strong{display:block;color:#1284ba;font-size:27px;margin-top:3px}
.documents{margin-top:14px;padding:14px 16px;border:1px solid #91adbf;border-radius:12px;background:#e8f6fc}
.documents h3{margin:0 0 7px;font-size:14px}
.doc-line{margin:5px 0;font-size:12px;line-height:1.45;color:#354b60;font-weight:700}
.footer{margin-top:12px;padding:10px 12px;border:1px solid #91adbf;border-radius:9px;background:#f2faff;color:#1d354b;font-size:11px;line-height:1.55}
.footer b{display:block;margin-bottom:3px;color:#168dca;font-size:13px;font-weight:900}
.actions{width:min(820px,calc(100% - 24px));margin:0 auto 24px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{height:50px;border-radius:12px;font:inherit;font-weight:900;cursor:pointer}
.print{border:0;background:var(--s);color:#fff}
.back{border:1px solid var(--s);background:#fff;color:var(--sd)}
@media(max-width:640px){
 .sheet{width:calc(100% - 16px);margin:8px auto;padding:18px 14px;border-radius:14px}
 .head{align-items:flex-start;flex-wrap:wrap;gap:6px}
 .brand{font-size:24px}.title{order:3;flex-basis:100%;text-align:left;font-size:18px}.date{font-size:10px}
 .columns{grid-template-columns:1fr;gap:14px}
 .row{font-size:12.5px}.total strong{font-size:24px}
 .actions{width:calc(100% - 16px);grid-template-columns:1fr;margin-bottom:14px}
}
@media print{
 @page{size:A4;margin:12mm}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 body{background:#fff}
 .sheet{width:100%;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}
 .actions{display:none!important}
 .head{padding-bottom:12px;margin-bottom:14px}
 .brand{font-size:30px}.title{font-size:22px}.date{font-size:12px}
 .selected{font-size:13px}.columns{grid-template-columns:1.2fr .8fr;gap:18px}
 h3{font-size:17px}.row{padding:8px 0;font-size:14px}
 .total strong{font-size:26px}.documents{padding:14px 16px}
 .doc-line{font-size:13px}.footer{font-size:12.5px}
}
</style>
</head>
<body>
<main class="sheet">
  <div class="head"><div class="brand">등기로</div><div class="title">법인등기 예상 견적서</div><div class="date" id="printDate"></div></div>
  <div class="selected" id="selectedText"></div>
  <div class="columns">
    <section>
      <h3>공과금</h3>
      <div class="row"><span>등록면허세·교육세</span><b id="taxTotal"></b></div>
      <div class="row"><span>법인등기 신청수수료</span><b id="filingFee"></b></div>
      <div class="row"><span>공증비용</span><b id="notaryFee"></b></div>
      <div class="row"><span>제증명 비용</span><b id="extraFee"></b></div>
      <div class="row" id="sealCostRow"><span>법인도장 제작비</span><b id="sealCost"></b></div>
    </section>
    <section>
      <h3>법무사 보수</h3>
      <div class="row"><span>법무사 보수</span><b id="fee"></b></div>
      <div class="row"><span>부가가치세</span><b id="vat"></b></div>
    </section>
  </div>
  <div class="total"><span>예상 총액</span><strong id="grandTotal"></strong></div>
  <div class="documents"><h3>고객 준비서류</h3><div id="documentListCorp"></div></div>
  <div class="footer"><b>등기로 | 현재두 법무사 사무소</b><div>인천 미추홀구 경원대로 873, 201호(주안동, 인성빌딩) · 인천가정법원 옆</div><div>전화 032-425-1500　이메일 hjd21@naver.com　홈페이지 www.deunggiro.kr</div></div>
</main>
<div class="actions">
  <button class="print" type="button" onclick="window.print()">PDF 저장 / 인쇄</button>
  <button class="back" type="button" onclick="history.back()">계산기로 돌아가기</button>
</div>
<script>
(function(){
  let data={};
  try{data=JSON.parse(sessionStorage.getItem('deunggiroCorpEstimatePrint')||'{}')}catch(e){}
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v||''};
  set('printDate',data.date||('견적일 '+new Date().toLocaleDateString('ko-KR')));
  set('selectedText',data.selectedText||'법인등기 예상 견적');
  ['taxTotal','filingFee','notaryFee','extraFee','sealCost','fee','vat','grandTotal'].forEach(id=>set(id,data[id]));
  if(data.sealVisible===false)document.getElementById('sealCostRow').style.display='none';
  document.getElementById('documentListCorp').innerHTML=data.documents||'<div class="doc-line">준비서류 정보가 없습니다.</div>';
  setTimeout(()=>{try{window.print()}catch(e){}},350);
})();
</script>
</body>
</html>
