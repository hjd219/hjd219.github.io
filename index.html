<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>등기로 계산기 | 취득세·법인등기 비용</title>
<meta name="description" content="등기로 부동산 취득세 및 법인등기 비용 계산기입니다.">
<style>
:root{--s:#35a9e1;--sd:#168dca;--n:#172840;--l:#e4ebf1;--bg:#f5f8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#202936}
.header{height:76px;background:#fff;border-bottom:3px solid var(--s);display:flex;align-items:center}
.head{width:min(1180px,calc(100% - 32px));margin:auto}
.logo{display:inline-block;font-size:28px;font-weight:900;letter-spacing:-1.5px;color:var(--s);text-decoration:none}
.logo small{display:block;font-size:11px;color:#777;font-weight:500;letter-spacing:0}
.nav-wrap{width:min(1120px,calc(100% - 28px));margin:24px auto 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 12px 35px rgba(23,40,64,.06)}
.tab{height:54px;border:1px solid #dce5ed;border-radius:12px;background:#fff;color:#455468;font-size:15px;font-weight:900;cursor:pointer}
.tab.on{border:2px solid var(--s);background:#effaff;color:#137fb4}
.frame-wrap{width:100%;max-width:1180px;margin:0 auto}
iframe{display:block;width:100%;height:1030px;border:0;background:var(--bg)}
.hidden{display:none}
@media(max-width:800px){
 .header{height:64px;border-bottom-width:2px}
 .logo{font-size:26px}
 .nav-wrap{width:calc(100% - 20px);margin-top:14px}
 .tabs{padding:7px;gap:7px;border-radius:13px}
 .tab{height:50px;padding:4px 7px;font-size:13px;line-height:1.3}
 iframe{height:1430px}
}
</style>
</head>
<body>
<header class="header"><div class="head"><a class="logo" href="https://www.deunggiro.kr/">등기로<small>현재두 법무사 사무소</small></a></div></header>
<nav class="nav-wrap" aria-label="계산기 선택">
 <div class="tabs">
  <button class="tab on" data-target="acq">부동산 취득세 계산기</button>
  <button class="tab" data-target="corp">법인등기 비용 계산기</button>
 </div>
</nav>
<main class="frame-wrap">
 <iframe id="acq" title="부동산 취득세 계산기" src="acquisition-calculator.html"></iframe>
 <iframe id="corp" class="hidden" title="법인등기 비용 계산기" src="corporate-calculator.html"></iframe>
</main>
<script>
document.querySelectorAll('.tab').forEach(function(btn){
 btn.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
  document.querySelectorAll('iframe').forEach(function(x){x.classList.add('hidden')});
  btn.classList.add('on');
  document.getElementById(btn.dataset.target).classList.remove('hidden');
 });
});
</script>
</body>
</html>
