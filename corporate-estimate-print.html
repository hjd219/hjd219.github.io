<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>법인등기 예상 견적서 | 등기로</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
:root{--s:#35a9e1;--sd:#168dca;--n:#172840;--bg:#f5f8fb;--l:#dfe8ef}
body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#202936}
.wrap{width:min(760px,calc(100% - 24px));margin:24px auto}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
button,a{height:48px;border-radius:11px;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none}
button{flex:1;border:0;background:var(--s);color:#fff}
a{width:110px;border:1px solid var(--s);background:#fff;color:var(--sd)}
.sheet{background:#fff;border:1px solid var(--l);border-radius:16px;padding:28px;box-shadow:0 12px 36px rgba(23,40,64,.08)}
.title{display:flex;align-items:end;justify-content:space-between;padding-bottom:14px;margin-bottom:16px;border-bottom:3px solid var(--s)}
.title b{font-size:30px;color:var(--s)}
.title span{font-size:22px;font-weight:900;color:var(--n)}
.title small{font-size:12px;color:#718096}
.selected{font-size:13px;color:#526171;margin-bottom:14px;font-weight:700}
.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px}
h3{font-size:17px;margin:6px 0 9px;color:#10263d}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #91adbf}
.row span,.row b{font-size:14px;line-height:1.35}
.row span{color:#10263d;font-weight:700}.row b{color:#091f33;font-weight:800;text-align:right}
.total{margin-top:10px;padding:13px 15px;border-radius:12px;background:#f0f9fd}
.total span{font-size:13px;font-weight:800;color:#263e53}.total strong{display:block;color:#1284ba;font-size:26px;margin-top:3px}
.documents{display:block;margin-top:12px;padding:14px 16px;border:1px solid #91adbf;border-radius:12px;background:#e8f6fc}
.documents h3{font-size:14px;margin:0 0 8px;font-weight:900}.doc-line{font-size:13px;line-height:1.45;margin:5px 0;font-weight:750;color:#263e53}.doc-line b{color:#10263d}
.office{display:block;margin-top:10px;padding:10px 12px;border:1px solid #91adbf;border-radius:9px;background:#f2faff;color:#263e53;font-size:12.5px;line-height:1.5;font-weight:750}
.office b{display:block;margin-bottom:3px;color:#168dca;font-size:14px;font-weight:900}
.empty{padding:28px;text-align:center;color:#6b7785}
@media(max-width:640px){.wrap{width:calc(100% - 16px);margin:10px auto}.sheet{padding:18px 14px;border-radius:12px}.columns{grid-template-columns:1fr}.title{align-items:flex-start;gap:6px;flex-direction:column}.title b{font-size:26px}.title span{font-size:19px}.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}.row span,.row b{font-size:13px}}
@media print{
 @page{size:A4;margin:12mm}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
 body{background:#fff}.wrap{width:100%;margin:0}.toolbar{display:none!important}.sheet{border:0;box-shadow:none;padding:0;border-radius:0}
 .columns{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px}
}
</style>
</head>
<body>
<main class="wrap">
<div class="toolbar"><button type="button" onclick="window.print()">PDF 저장 / 인쇄</button><a href="/corporate-calculator.html">돌아가기</a></div>
<section class="sheet" id="sheet">
<div class="title"><b>등기로</b><span>법인등기 예상 견적서</span><small id="date"></small></div>
<div class="selected" id="selected"></div>
<div class="columns">
<div><h3>공과금</h3>
<div class="row"><span>등록면허세·교육세</span><b id="tax"></b></div>
<div class="row"><span>법인등기 신청수수료</span><b id="filing"></b></div>
<div class="row"><span>공증비용</span><b id="notary"></b></div>
<div class="row"><span>제증명 비용</span><b id="extra"></b></div>
<div class="row" id="sealRow"><span>법인도장 제작비</span><b id="seal"></b></div>
</div>
<div><h3>법무사 보수</h3>
<div class="row"><span>법무사 보수</span><b id="fee"></b></div>
<div class="row"><span>부가가치세</span><b id="vat"></b></div>
</div>
</div>
<div class="total"><span>예상 총액</span><strong id="total"></strong></div>
<div class="documents"><h3>고객 준비서류</h3><div id="documents"></div></div>
<div class="office"><b>등기로 | 현재두 법무사 사무소</b><div>인천 미추홀구 경원대로 873, 201호(주안동, 인성빌딩) · 인천가정법원 옆</div><div>전화 032-425-1500　이메일 hjd21@naver.com　홈페이지 www.deunggiro.kr</div></div>
</section>
</main>
<script>
(function(){
  const raw=sessionStorage.getItem('corporateEstimatePrint');
  if(!raw){
    document.getElementById('sheet').innerHTML='<div class="empty">견적 정보가 없습니다.<br>계산기에서 견적을 계산한 뒤 다시 이용해주세요.</div>';
    return;
  }
  try{
    const d=JSON.parse(raw);
    const set=(id,v)=>document.getElementById(id).textContent=v||'0원';
    set('date',d.date);set('selected',d.selected);set('tax',d.tax);set('filing',d.filing);
    set('notary',d.notary);set('extra',d.extra);set('seal',d.seal);set('fee',d.fee);set('vat',d.vat);set('total',d.total);
    if(!d.showSeal)document.getElementById('sealRow').style.display='none';
    document.getElementById('documents').innerHTML=d.documents||'<div class="doc-line">준비서류 정보가 없습니다.</div>';
  }catch(e){
    document.getElementById('sheet').innerHTML='<div class="empty">견적 정보를 불러오지 못했습니다.<br>계산기에서 다시 시도해주세요.</div>';
  }
})();
</script>
</body>
</html>
